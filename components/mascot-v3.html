<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component: mascot v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
<link rel="stylesheet" href="../css/staging/mascot-v3.css">
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<section class="f-section-md">
<div class="f-page-margin">
<!-- component:start -->
<section class="mascot_root" data-mascot data-mascot-src="../assets/arlo-motion-v3/" data-clip-walk="../assets/arlo-motion-v3/arlo-walk.svg" data-clip-walk-stop="../assets/arlo-motion-v3/arlo-walk-stop.svg" data-clip-stand-idle="../assets/arlo-motion-v3/arlo-stand-idle.svg" data-clip-sit="../assets/arlo-motion-v3/arlo-sit.svg" data-clip-sit-stand="../assets/arlo-motion-v3/arlo-sit-stand.svg" data-clip-lie="../assets/arlo-motion-v3/arlo-lie.svg" data-clip-lie-sit="../assets/arlo-motion-v3/arlo-lie-sit.svg" data-clip-stand="../assets/arlo-motion-v3/arlo-stand.svg" data-clip-up-stand="../assets/arlo-motion-v3/arlo-up-stand.svg" data-clip-jump="../assets/arlo-motion-v3/arlo-jump.svg" data-clip-idle-sit="../assets/arlo-motion-v3/arlo-idle-sit.svg" data-clip-idle-lie="../assets/arlo-motion-v3/arlo-idle-lie.svg" data-clip-idle-up="../assets/arlo-motion-v3/arlo-idle-up.svg" aria-label="Arlo, the Cosmic armadillo, wandering along">
  <div class="mascot_track" data-mascot-track>
    <div class="mascot_arlo" data-mascot-arlo><span class="mascot_stage" data-mascot-stage></span></div>
  </div>
</section>
<!-- component:end -->
</div>
</section>
</div>
<script src="../assets/runtime.js" defer></script>
<script src="../js/mascot-v3.js" defer></script>
</body>
</html>
