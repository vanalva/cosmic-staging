<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Cosmic] component: referral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<!-- one referral with its status detail; js/club-member.js fills fields and marks steps .is-done -->
<div class="club-member_wrap">
<!-- component:start -->
<ul class="referral_list">
    <li class="referral_item" data-club-item>
      <details class="referral_root">
        <summary class="referral_trigger">
          <span class="f-text-small f-text-bold referral_avatar" aria-hidden="true" data-club-field="initials">AR</span>
          <span class="referral_who">
            <span class="f-text-body f-text-bold referral_name" data-club-field="name">Ana Ruiz</span>
            <span class="f-text-small referral_need" data-club-field="need">Interior paint &middot; Zilker</span>
          </span>
          <span class="f-text-micro f-text-bold f-text-uppercase referral_status" data-club-field="status">Credit added</span>
          <span class="f-text-body f-text-black referral_credit" data-club-field="credit">+$180</span>
          <svg class="referral_indicator" data-club-field="indicator" viewBox="0 0 27.02 28.101" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M16.42,27.106c-.045,1.324-4.854,1.309-5.48.062l-.311-9.889-9.702-.228c-1.225-1.113-1.258-4.819.042-5.894l9.682-.244.169-9.553c.027-1.548,5.348-1.896,5.413-.406l.435,9.861,9.959.291c.528,1.649.52,4.248.002,5.929l-9.873.119-.335,9.953Z" fill="currentColor"/></svg>
        </summary>
        <div class="referral_body">
          <ol class="referral_steps" aria-label="Referral status">
          <li class="referral_step" data-club-step="sent">
            <span class="referral_connector" aria-hidden="true"></span>
            <span class="referral_dot" aria-hidden="true"><svg class="referral_mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="referral_step_text"><span class="f-text-small f-text-bold referral_label">Sent</span><span class="f-text-micro referral_date" data-club-field="date"></span></span>
          </li>
          <li class="referral_step" data-club-step="booked">
            <span class="referral_connector" aria-hidden="true"></span>
            <span class="referral_dot" aria-hidden="true"><svg class="referral_mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="referral_step_text"><span class="f-text-small f-text-bold referral_label">Project booked</span><span class="f-text-micro referral_date" data-club-field="date"></span></span>
          </li>
          <li class="referral_step" data-club-step="paid">
            <span class="referral_connector" aria-hidden="true"></span>
            <span class="referral_dot" aria-hidden="true"><svg class="referral_mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="referral_step_text"><span class="f-text-small f-text-bold referral_label">Completed and paid</span><span class="f-text-micro referral_date" data-club-field="date"></span></span>
          </li>
          <li class="referral_step" data-club-step="credited">
            <span class="referral_connector" aria-hidden="true"></span>
            <span class="referral_dot" aria-hidden="true"><svg class="referral_mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="referral_step_text"><span class="f-text-small f-text-bold referral_label">Credit added</span><span class="f-text-micro referral_date" data-club-field="date"></span></span>
          </li>
          </ol>
          <p class="f-text-small referral_math" data-club-field="math">$1,800 of completed work at $100 per $1,000 = $180.</p>
        </div>
      </details>
    </li>
</ul>
<!-- component:end -->
</div>
</div>
</body>
</html>
