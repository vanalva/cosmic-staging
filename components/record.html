<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Cosmic] component: record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<!-- project record card (colors, finish, warranty, notes) -->
<div class="club-member_wrap">
<!-- component:start -->
<div class="record_grid">
    <article class="record_card" data-club-item>
      <div class="record_media" data-club-field="media">
        <img class="record_img" data-club-field="photo" src="../assets/photo-painter-exterior-ladder.jpg" alt="Exterior repaint: a painter rolling the stucco wall" width="1122" height="1402" loading="lazy">
        <p class="f-text-small record_media_empty" data-club-field="empty">No photos on file yet</p>
      </div>
      <div class="record_head">
        <span class="record_icon" data-club-field="icon"></span>
        <div class="record_titles">
          <h3 class="f-text-h5 f-text-black f-text-uppercase record_title" data-club-field="name">Exterior repaint</h3>
          <p class="f-text-small record_when" data-club-field="when">Whole house &middot; completed May 2026</p>
        </div>
      </div>
      <dl class="record_facts">
        <div class="record_fact"><dt class="f-text-micro f-text-bold f-text-uppercase record_label">Colors</dt>
          <dd class="record_value"><ul class="record_swatches" data-club-field="colors">
            <li class="f-text-small record_swatch" data-club-item data-club-swatch><span class="record_chip" aria-hidden="true"></span><span class="record_swatch_text" data-club-swatch-text>Body &middot; Naval SW 6244</span></li>
          </ul></dd></div>
        <div class="record_fact"><dt class="f-text-micro f-text-bold f-text-uppercase record_label">Finish</dt><dd class="f-text-small record_value" data-club-field="finish">Satin body, semi-gloss trim.</dd></div>
        <div class="record_fact"><dt class="f-text-micro f-text-bold f-text-uppercase record_label">Warranty</dt><dd class="f-text-small record_value" data-club-field="warranty">Workmanship, until May 2028</dd></div>
        <div class="record_fact"><dt class="f-text-micro f-text-bold f-text-uppercase record_label">Notes</dt><dd class="f-text-small record_value" data-club-field="notes">Leftover paint in the garage.</dd></div>
      </dl>
    </article>
</div>
<!-- component:end -->
</div>
</div>
</body>
</html>
