<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component: mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
<link rel="stylesheet" href="../css/staging/mascot.css">
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<section class="f-section-md">
<div class="f-page-margin">
<!-- component:start -->
<section class="mascot_root" data-mascot data-mascot-src="../assets/arlo-motion-v2/" data-clip-walk="../assets/arlo-motion-v2/arlo-walk.svg" data-clip-sit="../assets/arlo-motion-v2/arlo-sit.svg" data-clip-stand="../assets/arlo-motion-v2/arlo-stand.svg" data-clip-lie="../assets/arlo-motion-v2/arlo-lie.svg" data-clip-hop="../assets/arlo-motion-v2/arlo-hop.svg" data-clip-idle-sit="../assets/arlo-motion-v2/arlo-idle-sit.svg" data-clip-idle-stand="../assets/arlo-motion-v2/arlo-idle-stand.svg" data-clip-idle-lie="../assets/arlo-motion-v2/arlo-idle-lie.svg" aria-label="Arlo, the Cosmic armadillo">
  <div class="mascot_track" data-mascot-track>
    <div class="mascot_arlo" data-mascot-arlo>
      <button type="button" class="mascot_hit" data-mascot-hit aria-label="Arlo, the Cosmic armadillo: tell him what to do" aria-expanded="false" aria-controls="mascot-bubbles"><span class="mascot_stage" data-mascot-stage></span></button>
    </div>
    <div class="mascot_bubbles" id="mascot-bubbles" data-mascot-bubbles role="group" aria-label="Tell Arlo what to do">
      <div class="mascot_bubble" data-mascot-bubble><div class="mascot_bubble_float is-b1" data-mascot-float><button type="button" class="flwr_button_primary cecf1_root" data-flwr-trigger="hover focus" data-mascot-do="sit" aria-pressed="false"><span class="f-text-small cecf1_label" data-flwr-target="label">Sit</span></button></div></div>
      <div class="mascot_bubble" data-mascot-bubble><div class="mascot_bubble_float is-b2" data-mascot-float><button type="button" class="flwr_button_primary cecf1_root" data-flwr-trigger="hover focus" data-mascot-do="stand" aria-pressed="false"><span class="f-text-small cecf1_label" data-flwr-target="label">Stand up</span></button></div></div>
      <div class="mascot_bubble" data-mascot-bubble><div class="mascot_bubble_float is-b3" data-mascot-float><button type="button" class="flwr_button_primary cecf1_root" data-flwr-trigger="hover focus" data-mascot-do="hop" aria-pressed="false"><span class="f-text-small cecf1_label" data-flwr-target="label">Jump</span></button></div></div>
      <div class="mascot_bubble" data-mascot-bubble><div class="mascot_bubble_float is-b4" data-mascot-float><button type="button" class="flwr_button_primary cecf1_root" data-flwr-trigger="hover focus" data-mascot-do="lie" aria-pressed="false"><span class="f-text-small cecf1_label" data-flwr-target="label">Lie down</span></button></div></div>
      <div class="mascot_bubble" data-mascot-bubble><div class="mascot_bubble_float is-b5" data-mascot-float><button type="button" class="flwr_button_primary cecf1_root" data-flwr-trigger="hover focus" data-mascot-do="walk" aria-pressed="false"><span class="f-text-small cecf1_label" data-flwr-target="label">Walk on</span></button></div></div>
    </div>
  </div>
</section>
<!-- component:end -->
</div>
</section>
</div>
<script src="../assets/runtime.js" defer></script>
<script src="../js/mascot-v2.js" defer></script>
</body>
</html>
