<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component: search-field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
<style data-candidate="compare">
/* compare — tier-3 component tokens (EMBED: cannot be class rules).
   On promotion these move inside the INDIRECTION TIERS scope rule of tokens.css so
   dark/brand wrappers re-resolve them. Until then load this file AFTER tokens.css.
   The selector list mirrors tokens.css (v1.2). */
:root,
[data-flwr]:where(:not([data-flwr] [data-flwr])),
[data-flwr].f-mode-light, [data-flwr].f-mode-dark, [data-flwr].f-mode-brand,
[data-flwr] .f-mode-light, [data-flwr] .f-mode-dark, [data-flwr] .f-mode-brand,
[data-flwr].f-density-compact, [data-flwr].f-density-spacious,
[data-flwr] .f-density-compact, [data-flwr] .f-density-spacious,
[data-flwr] .f-section-default, [data-flwr] .f-section-inverse,
[data-flwr] .f-section-brand, [data-flwr] .f-section-subtle,
[data-flwr] .f-section-accent-soft {
  --_component---compare--radius:      var(--_component---card--radius);
  --_component---compare--aspect:      16 / 10;
  --_component---compare--line-width:  2px;
  --_component---compare--line-color:  var(--_theme---surface--main);
  --_component---compare--knob-size:   2.75rem;
  --_component---compare--knob-bg:     var(--_theme---surface--main);
  --_component---compare--knob-text:   var(--_theme---text--main);
  --_component---compare--focus:       var(--_theme---border--focus);
  --_component---compare--label-bg:    var(--_theme---surface--overlay);
  --_component---compare--label-text:  var(--_theme---text--main);
  --_component---compare--label-gap:   var(--_spacing---step--3);
}

/* compare — two properties the Webflow styleLess matrix does not list (plugin/skills/webflow-check/styleless-compat.md:
   no `aspect-ratio`, and `-webkit-user-drag` is not one of the listed -webkit- properties), so they cannot be class
   rules: the box ratio and "an image cannot be dragged out of the slider". The converter's own sizing rule for a drawn
   box chains two more classes, so it still wins over this default. */
.flwr_compare_wrap { aspect-ratio: var(--_component---compare--aspect); }
.flwr_compare_layer { -webkit-user-drag: none; }
</style>
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<section class="f-section-md">
<div class="f-page-margin">
<!-- component:start -->
<div class="search_root" data-search>
  <div class="search_field">

    <label class="f-sr-only" for="demo-search">ZIP code or neighborhood</label>
    <input class="f-text-body search_input" id="demo-search" type="text" autocomplete="off" spellcheck="false" placeholder="78704 or Zilker" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="demo-search-list" data-search-input>
    <button type="button" class="search_clear is-hidden" aria-label="Clear" data-search-clear><svg class="search_clear_icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>
  <ul class="flwr_command_list search_list is-hidden" id="demo-search-list" role="listbox" aria-label="Suggestions" data-search-list></ul>
  <input type="hidden" data-search-value>
</div>
<!-- component:end -->
</div>
</section>
</div>
<script src="../assets/runtime.js" defer></script>
<script src="../js/search.js" defer></script>
<script>

document.addEventListener('DOMContentLoaded', function () {

    { label: 'Mueller', meta: '78723', value: '78723' }, { label: 'Travis Heights', meta: '78704', value: '78704' }] });
});
</script>
</body>
</html>
