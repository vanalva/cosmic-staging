<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive" data-flowriter-staging>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component: timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap">
<link rel="stylesheet" href="../css/framework.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/project.css">
</head>
<body>
<div class="f-mode-light f-page" data-flwr>
<section class="f-section-md">
<div class="f-page-margin">
<!-- component:start -->
<ol class="timeline_list" data-cms-list="timeline">
  <li class="timeline_item">
    <p class="timeline_day"><span class="f-text-micro f-text-bold f-text-uppercase timeline_day_label">Day</span><span class="f-text-h3 f-text-black timeline_day_num">1</span></p>
    <div class="timeline_body">
      <h3 class="f-text-h6 f-text-black f-text-uppercase timeline_title">Walkthrough and wash</h3>
      <p class="f-text-small timeline_text">Walked the house with the owners and photographed every side. Pressure-washed siding, trim and porch.</p>
      <figure class="timeline_media"><img class="timeline_img" src="../assets/photo-truck-street.jpg" alt="The Cosmic truck parked on the street outside the house (stand-in photo)" width="1448" height="1086" loading="lazy"><figcaption class="f-text-micro timeline_caption">On site for the walkthrough.</figcaption></figure>
    </div>
  </li>
  <li class="timeline_item">
    <p class="timeline_day"><span class="f-text-micro f-text-bold f-text-uppercase timeline_day_label">Day</span><span class="f-text-h3 f-text-black timeline_day_num">2</span></p>
    <div class="timeline_body">
      <h3 class="f-text-h6 f-text-black f-text-uppercase timeline_title">Repairs</h3>
      <p class="f-text-small timeline_text">New sills on two windows and a new base on the porch post, primed the same day.</p>
    </div>
  </li>
</ol>
<!-- component:end -->
</div>
</section>
</div>
</body>
</html>
