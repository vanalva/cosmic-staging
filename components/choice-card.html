/* compare — tier-3 component tokens (EMBED: cannot be class rules).
   On promotion these move inside the INDIRECTION TIERS scope rule of tokens.css so
   dark/brand wrappers re-resolve them. Until then load this file AFTER tokens.css.
   The selector list mirrors tokens.css (v1.2). */
:root,
[data-flwr]:where(:not([data-flwr] [data-flwr])),
[data-flwr].f-mode-light, [data-flwr].f-mode-dark, [data-flwr].f-mode-brand,
[data-flwr] .f-mode-light, [data-flwr] .f-mode-dark, [data-flwr] .f-mode-brand,
[data-flwr].f-density-compact, [data-flwr].f-density-spacious,
[data-flwr] .f-density-compact, [data-flwr] .f-density-spacious,
[data-flwr] .f-section-default, [data-flwr] .f-section-inverse,
[data-flwr] .f-section-brand, [data-flwr] .f-section-subtle,
[data-flwr] .f-section-accent-soft {
  --_component---compare--radius:      var(--_component---card--radius);
  --_component---compare--aspect:      16 / 10;
  --_component---compare--line-width:  2px;
  --_component---compare--line-color:  var(--_theme---surface--main);
  --_component---compare--knob-size:   2.75rem;
  --_component---compare--knob-bg:     var(--_theme---surface--main);
  --_component---compare--knob-text:   var(--_theme---text--main);
  --_component---compare--focus:       var(--_theme---border--focus);
  --_component---compare--label-bg:    var(--_theme---surface--overlay);
  --_component---compare--label-text:  var(--_theme---text--main);
  --_component---compare--label-gap:   var(--_spacing---step--3);
}

/* compare — two properties the Webflow styleLess matrix does not list (plugin/skills/webflow-check/styleless-compat.md:
   no `aspect-ratio`, and `-webkit-user-drag` is not one of the listed -webkit- properties), so they cannot be class
   rules: the box ratio and "an image cannot be dragged out of the slider". The converter's own sizing rule for a drawn
   box chains two more classes, so it still wins over this default. */
.flwr_compare_wrap { aspect-ratio: var(--_component---compare--aspect); }
.flwr_compare_layer { -webkit-user-drag: none; }
</style>
